name: Check

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  check:
    name: Check
    # Pinned for the same reason as the Build workflow: ubuntu-latest is now
    # Ubuntu 26.04, where the vendored C/C++ sources are untested.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@1.75.0

      - name: Run cargo check
        run: cargo check --locked --all

      - name: Run validate chainspecs
        run: |
          cargo build --locked --release -p chainspec
          for spec in crates/ethcore/res/chainspec/*.json crates/ethcore/res/chainspec/test/*.json; do
            ./target/release/chainspec "$spec"
          done
