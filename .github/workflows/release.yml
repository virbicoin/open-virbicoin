name: Release ovbc binaries

# Build the open-virbicoin (ovbc) client and publish the binaries to a GitHub
# Release whenever a version tag is pushed. Users can then download a prebuilt
# binary from the Releases page and run it with no arguments to join the
# VirBiCoin network.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # The Linux binaries are built in an Ubuntu 22.04 container instead of on
    # the runner itself, so they keep running on Ubuntu 22.04, Debian 12 and
    # later (glibc 2.34+, GCC 12+ C++ runtime) although GitHub retires the
    # ubuntu-22.04 runners on 2027-04-17: a binary built directly on a newer
    # runner would need that runner's newer glibc. Windows and macOS leave
    # `container` unset and build on the runner.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            container: ubuntu:22.04
            target: x86_64-unknown-linux-gnu
            archive: ovbc-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            container: ubuntu:22.04
            target: aarch64-unknown-linux-gnu
            archive: ovbc-linux-aarch64.tar.gz
          # windows-2022 ships Visual Studio 2022, which the CMake generator
          # below names; windows-latest only has a newer Visual Studio.
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: ovbc-windows-x86_64.zip
          # Apple Silicon needs the local ring 0.14.6 patch (patches/ring) and
          # the RocksDB ROCKSDB_LITE fix (patches/parity-rocksdb-sys).
          - os: macos-15
            target: aarch64-apple-darwin
            archive: ovbc-darwin-aarch64.tar.gz
          # GitHub's Intel macOS runners are free for public repositories
          # until x86_64 macOS support ends in August 2027.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: ovbc-darwin-x86_64.tar.gz
          # Windows arm64 is not buildable with this dependency tree: winapi
          # 0.2 (mio/tokio 0.1 stack) has no aarch64 definitions and ring only
          # gained Windows arm64 support in 0.17. Windows-on-ARM users can run
          # the x86_64 binary through the built-in x64 emulation.
    steps:
      # The container image is bare and jobs run in it as root (no sudo).
      # Install git before the checkout so it makes a real clone (the
      # parity-version build script reads the commit hash from it), curl for
      # rustup, and the C/C++ toolchain.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config \
            libudev-dev clang libclang-dev

      - name: Checkout sources
        uses: actions/checkout@v7

      # Inside the container the checkout belongs to another user than root.
      # Mark it safe, or the git calls made later by the build fail with
      # "dubious ownership" and the binary loses its commit hash.
      - name: Trust the checkout (Linux)
        if: runner.os == 'Linux'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@1.75.0
        with:
          targets: ${{ matrix.target }}

      # Pin a stable CMake. CMake 3.31 (current on the runners) rejects the old
      # RocksDB/snappy projects: its internal try_compile uses a set() form that
      # errors under cmake_minimum_required(3.5). 3.29 builds them fine.
      - name: Install CMake 3.29
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.29.6"

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # cmake 0.1.46 detects VS2022 but doesn't know its generator name. Tell it
      # explicitly via CMAKE_GENERATOR so it skips its own (incomplete) probing
      # and lets the system CMake (which fully supports VS2022) configure snappy.
      - name: Select CMake generator (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR_PLATFORM=x64" >> "$GITHUB_ENV"

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      # Stable releases (plain tags like v3.3.5) flip the version track to
      # "stable" via the `final` feature, so the published binaries report
      # "Ovbc/vX.Y.Z-stable/...". Pre-release tags (e.g. v3.3.5-rc1) and manual
      # runs stay "unstable".
      - name: Select build features
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" != *-* ]]; then
            echo "OVBC_FEATURES=--features final" >> "$GITHUB_ENV"
          else
            echo "OVBC_FEATURES=" >> "$GITHUB_ENV"
          fi

      - name: Build ovbc
        run: cargo build --release --bin ovbc --target ${{ matrix.target }} ${{ env.OVBC_FEATURES }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" ovbc
          ( cd dist && shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256" )

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          ( cd "target/${{ matrix.target }}/release" && 7z a "../../../dist/${{ matrix.archive }}" ovbc.exe )
          ( cd dist && certutil -hashfile "${{ matrix.archive }}" SHA256 > "${{ matrix.archive }}.sha256" )

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # Mark pre-release tags (anything with a hyphen, e.g. v3.3.5-vbc1) as
          # a GitHub pre-release; plain version tags (v3.3.5) publish normally.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Create the release as a draft so assets can be attached first. This
          # repository uses immutable releases, which reject asset uploads after
          # a release is published; publish the draft manually once it's ready.
          draft: true
