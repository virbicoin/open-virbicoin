name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build
    # Pinned rather than ubuntu-latest, which moved to Ubuntu 26.04 (GCC 15,
    # CMake 4) in November 2026. The vendored 2018-era RocksDB/snappy sources
    # are known to build with the Ubuntu 24.04 toolchain but untested on 26.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@1.75.0

      - name: Build
        run: cargo build --locked --all --release
