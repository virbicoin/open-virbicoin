name: rustfmt

on: [push, pull_request]

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins 1.75.0 (with rustfmt) for this repository, so
      # install that toolchain rather than an unused `stable`.
      - uses: dtolnay/rust-toolchain@1.75.0
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check
